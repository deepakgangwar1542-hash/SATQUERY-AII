name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Contract + unit + integration tests (§18)
        run: python -m pytest tests/ -q --timeout=300
      - name: License audit present (§14.4 gate)
        run: test -f LICENSE_AUDIT.md && grep -q "CDLA-Permissive" LICENSE_AUDIT.md

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  eval-smoke:
    # §18 Evaluation row: metrics computation must not silently break.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - run: python scripts/make_sample_data.py
      - run: python scripts/eval/eval_change.py
      - run: python bigearthnet_module/src/train.py --source synthetic --n 90
